# .github/workflows/deploy.yml
#
# Production Deployment Pipeline (Consolidated 4-Stage Architecture)
#
# Design principles:
#   1. Triggered ONLY after CodeQL deep scan completes successfully — no polling, no race.
#      Uses workflow_run event: deploy is event-driven, not concurrent with security scan.
#   2. Consolidated validate stage: security gate, TypeScript check, Fastify bootstrap,
#      env contract, infra leakage guard, and full test suite in a single job.
#   3. Deterministic build & push: Bit-for-bit reproducible image tagged by commit SHA
#      and pushed to GitHub Container Registry (GHCR).
#   4. Single SSH deployment session: Runs VPS readiness check and deploy.sh in a single
#      SSH invocation to eliminate network flakiness, credential fatigue, and session drops.
#   5. Automated rollback: Triggers if deployment or post-switch verification fails.
#   6. Third-party actions pinned to immutable commit SHAs for security & reproducibility.
#   7. Concurrency group 'production-deploy' with cancel-in-progress: false prevents overlaps.
#
# Pipeline structure:
#   validate (security gate, typecheck, bootstrap, env/infra guards, tests)
#     └─► build-push (build image, verify TLS, compare PR digest, push to GHCR)
#           └─► deploy (single SSH session: readiness check + blue-green deploy.sh)
#                 └─► rollback (auto-recovery on deployment failure)

name: Deploy to Production

on:
  workflow_run:
    workflows: ["CodeQL — Deep Scan (post-merge)"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1: validate
  #
  # Combines pre-flight security gate, SHA resolution, linting, typechecking,
  # bootstrap sanity, architectural contract guards, and full API test suite.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate (Security Gate, Contracts & Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy_sha: ${{ steps.sha.outputs.deploy_sha }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_TEST }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_TEST }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
    steps:
      - name: Resolve deploy SHA
        id: sha
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "deploy_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify CodeQL deep scan passed
        if: github.event_name == 'workflow_run'
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          echo "CodeQL deep scan conclusion : $CONCLUSION"
          echo "Scanned commit SHA          : $SHA"
          echo "Head branch                 : $BRANCH"
          if [ "$BRANCH" != "master" ]; then
            echo "::error::Deploy blocked — head_branch=$BRANCH (only master is allowed to deploy to production)."
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::CodeQL deep scan did not pass (conclusion=$CONCLUSION)."
            exit 1
          fi
          echo "✓ CodeQL gate passed — safe to deploy SHA $SHA (branch=$BRANCH)"

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.sha.outputs.deploy_sha }}

      - name: Setup Node.js 24
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (with retry)
        run: |
          echo "::group::npm ci"
          for attempt in 1 2 3; do
            npm ci && break
            [ $attempt -eq 3 ] && { echo "::error::npm ci failed after 3 attempts"; exit 1; }
            echo "Attempt $attempt failed — retrying in 15s..."
            sleep 15
          done
          echo "::endgroup::"

      - name: TypeScript check
        run: npm run typecheck

      - name: Fastify bootstrap sanity check
        run: npm run ci:bootstrap

      - name: Env contract guard (no direct process.env outside env.ts)
        run: |
          if grep -r --include="*.ts" "process\.env" src/ \
               | grep -v "src/config/env\.ts"; then
            echo "::error::Direct process.env access detected outside env.ts — use: import { env } from './config/env.js' instead"
            exit 1
          fi
          echo "✅ Env contract clean — no direct process.env access outside env.ts"

      - name: Block monitoring infra client references in API source
        run: |
          LEAKS=$(grep -rhE "(alertmanager|docker-compose\.monitoring)" src/ tests/ 2>/dev/null \
                    | grep -Ev '^\s*(//|#|\*|/\*)' || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::Infra client references found in src/ or tests/"
            echo "$LEAKS"
            exit 1
          fi
          echo "✓ No alertmanager/monitoring-compose references in src/ or tests/"

      - name: Block docker-compose.monitoring references in deploy path
        run: |
          if grep -E "docker-compose\.monitoring" scripts/deploy.sh 2>/dev/null | grep -Ev '^\s*#'; then
            echo "::error::deploy.sh references docker-compose.monitoring — deploy must be monitoring-independent"
            exit 1
          fi
          echo "✓ No docker-compose.monitoring references in scripts/deploy.sh"

      - name: Block /ready in deploy path (deploy.sh)
        run: |
          if grep -E "(/ready)" scripts/deploy.sh | grep -Ev '^\s*#'; then
            echo "::error::deploy.sh references /ready — deploy gate must use /health only"
            exit 1
          fi
          echo "✓ deploy.sh does not reference /ready"

      - name: Infra contract naming guard
        run: |
          FAIL=0
          if grep -rE '\bfieldtrack_network\b' src/ scripts/ \
               --include='*.ts' --include='*.sh' \
               2>/dev/null | grep -Ev '^[^:]+:\s*(#|//)'; then
            echo "::error::Forbidden network name 'fieldtrack_network' found — canonical name is 'api_network'"
            FAIL=1
          fi

          if grep -rE 'redis://localhost:[0-9]+|redis://127\.0\.0\.1:[0-9]+' . \
               --exclude-dir=docs \
               --exclude-dir=tests \
               --exclude-dir=node_modules \
               --exclude-dir=.git \
               --exclude-dir=codeql-db \
               --exclude='*.md' \
               --exclude='*.test.ts' \
               --exclude='*.unit.ts' \
               --exclude='.env.example.dev' \
               2>/dev/null | grep -Fv 'env-setup.ts' | grep -q .; then
            echo "::error::localhost Redis URL found in production paths — canonical URL is redis://redis:6379"
            FAIL=1
          fi

          [ "$FAIL" -eq 0 ] || exit 1
          echo "✓ Infra contract naming guard passed (api_network, redis://redis:6379)"

      - name: Run all tests
        run: npm test

  # ---------------------------------------------------------------------------
  # STAGE 2: build-push
  #
  # Builds production Docker image, verifies runtime TLS, compares digest with
  # PR simulation, and pushes tagged images (full SHA and short SHA) to GHCR.
  # ---------------------------------------------------------------------------
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [validate]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      sha_short:  ${{ steps.meta.outputs.sha_short }}
      digest:     ${{ steps.digest.outputs.digest }}
      deploy_sha: ${{ steps.meta.outputs.deploy_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.deploy_sha }}

      - name: Extract commit SHA
        id: meta
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
        run: |
          echo "sha_short=${DEPLOY_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Pull base images (prevent stale cache)
        run: |
          docker pull node:24.2.0-bookworm-slim
          docker pull gcr.io/distroless/nodejs24-debian12:nonroot

      - name: Build Docker image (pre-scan, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          target: production
          build-args: |
            NODE_ENV=production
            CACHE_BUSTER=${{ hashFiles('**/package-lock.json') }}
          push: false
          load: true
          pull: true
          tags: |
            fieldtrack-api:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      - name: Verify Node.js runtime (TLS operational check)
        run: |
          IMAGE_NAME="fieldtrack-api:${{ steps.meta.outputs.sha_short }}"
          echo "Testing image: $IMAGE_NAME"
          docker run --rm \
            --entrypoint /nodejs/bin/node \
            "$IMAGE_NAME" \
            -e "
              const crypto = require('crypto');
              const tls = require('tls');
              const ctx = tls.createSecureContext();
              if (!ctx) { process.stderr.write('FAIL: TLS context failed\n'); process.exit(1); }
              const h = crypto.createHash('sha256').update('smoke').digest('hex');
              if (!h) { process.stderr.write('FAIL: hash failed\n'); process.exit(1); }
              process.stdout.write('node=' + process.versions.node + ' openssl=' + process.versions.openssl + ' tls=ok\n');
            "

      - name: Capture image digest
        id: digest
        run: |
          IMAGE_NAME="fieldtrack-api:${{ steps.meta.outputs.sha_short }}"
          DIGEST=$(docker inspect "$IMAGE_NAME" --format='{{.Id}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "::group::Build traceability"
          echo "  Commit SHA   : ${{ github.sha }}"
          echo "  Image tag    : $IMAGE_NAME"
          echo "  Image digest : $DIGEST"
          echo "::endgroup::"

      - name: Verify image digest parity with PR simulation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh api \
            "/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --jq '.[0].number // empty' 2>/dev/null || echo "")

          if [ -z "$PR_NUMBER" ]; then
            echo "No associated PR found for commit ${{ github.sha }} — skipping digest comparison."
            exit 0
          fi

          echo "Associated PR: #${PR_NUMBER}"
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "pr.yml" \
            --json databaseId,conclusion,headSha \
            --jq "map(select(.conclusion == \"success\")) | .[0].databaseId // empty" \
            2>/dev/null || echo "")

          if [ -z "$RUN_ID" ]; then
            echo "No successful PR validation run found — skipping digest comparison."
            exit 0
          fi

          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            --name "image-digest-pr-${PR_NUMBER}" \
            --dir /tmp/pr-digest \
            2>/dev/null || true

          if [ ! -f /tmp/pr-digest/image-digest.txt ]; then
            echo "PR image-digest artifact not found — skipping comparison."
            exit 0
          fi

          PR_DIGEST=$(cat /tmp/pr-digest/image-digest.txt)
          DEPLOY_DIGEST="${{ steps.digest.outputs.digest }}"
          if [ "$PR_DIGEST" = "$DEPLOY_DIGEST" ]; then
            echo "✓ Digest match — bit-for-bit parity confirmed between PR and deploy."
          else
            echo "⚠ Digest mismatch — builds diverged between PR and deploy."
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image to registry
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag \
            fieldtrack-api:${{ steps.meta.outputs.sha_short }} \
            ghcr.io/${OWNER}/api:${{ steps.meta.outputs.deploy_sha }}
          docker push ghcr.io/${OWNER}/api:${{ steps.meta.outputs.deploy_sha }}

          docker tag \
            fieldtrack-api:${{ steps.meta.outputs.sha_short }} \
            ghcr.io/${OWNER}/api:${{ steps.meta.outputs.sha_short }}
          docker push ghcr.io/${OWNER}/api:${{ steps.meta.outputs.sha_short }}
          echo "✓ Pushed ghcr.io/${OWNER}/api:${{ steps.meta.outputs.deploy_sha }}"

      - name: Save build provenance
        env:
          IMAGE_NAME: fieldtrack-api:${{ steps.meta.outputs.sha_short }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          echo "commit=${{ needs.validate.outputs.deploy_sha }}" > provenance.txt
          echo "ref=${{ github.ref }}" >> provenance.txt
          echo "image=${IMAGE_NAME}" >> provenance.txt
          echo "registry_tag=ghcr.io/${{ github.repository_owner }}/api:${{ steps.meta.outputs.deploy_sha }}" >> provenance.txt
          echo "digest=${IMAGE_DIGEST}" >> provenance.txt
          echo "workflow=${{ github.workflow }}" >> provenance.txt
          echo "run_id=${{ github.run_id }}" >> provenance.txt

      - name: Upload provenance artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: provenance-${{ steps.meta.outputs.sha_short }}
          path: provenance.txt
          retention-days: 90

  # ---------------------------------------------------------------------------
  # STAGE 3: deploy
  #
  # Single SSH session executing:
  #   1. VPS readiness check (vps-readiness-check.sh)
  #   2. Local repo sync to exact deploy SHA
  #   3. Blue-green deployment (deploy.sh) with single nginx reload & verification
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (Blue-Green VPS)
    runs-on: ubuntu-latest
    needs: [validate, build-push]
    timeout-minutes: 25
    steps:
      - name: Validate required deployment secrets
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
        run: |
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::error::API_BASE_URL secret is not set. Deployment aborted."
            exit 1
          fi
          if [ -z "${CORS_ORIGIN:-}" ]; then
            echo "::error::CORS_ORIGIN secret is not set. Deployment aborted."
            exit 1
          fi
          echo "✓ Required deployment secrets verified"

      - name: Execute Blue-Green Deployment via SSH
        uses: appleboy/ssh-action@7eaf76632fa5a71df542cbeccdbad22a0ec17904 # v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail
            T0=$(date +%s)
            export DEPLOY_ROOT="${DEPLOY_ROOT:-$HOME/api}"
            export INFRA_ROOT="${INFRA_ROOT:-/opt/infra}"
            [ -d "$DEPLOY_ROOT" ] || { echo "::error::DEPLOY_ROOT not found: $DEPLOY_ROOT"; exit 1; }
            cd "$DEPLOY_ROOT"

            echo "=== Step 1: Sync deployment scripts to exact commit SHA ==="
            git fetch origin
            git reset --hard "${{ needs.build-push.outputs.deploy_sha }}"
            chmod +x scripts/*.sh

            echo "=== Step 2: VPS Readiness Pre-Flight Check ==="
            ./scripts/vps-readiness-check.sh

            echo "=== Step 3: Run Blue-Green Deployment ==="
            ./scripts/deploy.sh "${{ needs.build-push.outputs.deploy_sha }}"

            echo "=== Step 4: Confirm Active Container & Health ==="
            ACTIVE_SLOT=$(cat "$DEPLOY_ROOT/.fieldtrack/active-slot" 2>/dev/null || cat /var/lib/fieldtrack/active-slot 2>/dev/null || echo "unknown")
            ACTIVE_CONTAINER="api-${ACTIVE_SLOT}"
            FT_CURL_IMG="curlimages/curl:8.7.1"
            docker inspect "$ACTIVE_CONTAINER" >/dev/null 2>&1 || {
              echo "::error::Active container $ACTIVE_CONTAINER is not running"
              exit 1
            }
            STATUS=$(docker run --rm --network api_network "$FT_CURL_IMG" \
              -s -o /dev/null -w "%{http_code}" \
              "http://$ACTIVE_CONTAINER:3000/health" 2>/dev/null || echo "000")
            if [ "$STATUS" != "200" ]; then
              echo "::error::Post-deploy container health check failed with status $STATUS"
              exit 1
            fi

            echo "[DEPLOY] Completed successfully in $(($(date +%s) - T0))s — active=$ACTIVE_CONTAINER slot=$ACTIVE_SLOT"

      - name: Deployment summary
        if: always()
        run: |
          DEPLOY_SHA="${{ needs.build-push.outputs.deploy_sha }}"
          {
            echo "## Deployment Summary"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Deploy SHA | \`${DEPLOY_SHA}\` |"
            echo "| Status | ${{ job.status }} |"
            echo "| Pipeline | Consolidated 4-Stage |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # STAGE 4: rollback
  #
  # Triggered automatically ONLY if the deploy job fails.
  # Restores previous active slot cleanly using deploy.sh --rollback --auto.
  # ---------------------------------------------------------------------------
  rollback:
    name: Rollback Deployment (Auto)
    runs-on: ubuntu-latest
    needs: [validate, build-push, deploy]
    timeout-minutes: 10
    if: failure() && needs.deploy.result == 'failure'
    steps:
      - name: Log rollback trigger
        run: |
          echo "::error::Deployment failure detected — initiating automated rollback for SHA ${{ needs.build-push.outputs.deploy_sha }}"

      - name: Execute Rollback via SSH
        uses: appleboy/ssh-action@7eaf76632fa5a71df542cbeccdbad22a0ec17904 # v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail
            export DEPLOY_ROOT="${DEPLOY_ROOT:-$HOME/api}"
            export INFRA_ROOT="${INFRA_ROOT:-/opt/infra}"
            [ -d "$DEPLOY_ROOT" ] || { echo "::error::DEPLOY_ROOT not found: $DEPLOY_ROOT"; exit 1; }
            cd "$DEPLOY_ROOT"
            chmod +x scripts/*.sh
            ./scripts/deploy.sh --rollback --auto

            ACTIVE_SLOT=$(cat "$DEPLOY_ROOT/.fieldtrack/active-slot" 2>/dev/null || cat /var/lib/fieldtrack/active-slot 2>/dev/null || echo "unknown")
            echo "[ROLLBACK] Auto-rollback completed — active slot is now: $ACTIVE_SLOT"
